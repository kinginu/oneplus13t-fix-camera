name: "Release Module"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g., CPH2723_16.0.8.301-r2)"
        required: true
      changelog_notes:
        description: 'Changelog notes for this release. Use "*" for list items.'
        required: true

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required files
        run: |
          [ -f update.json ] || echo '{}' > update.json
          [ -f changelog.md ] || touch changelog.md

      - name: Calculate version code
        id: versioning
        run: |
          current_code=$(grep '^versionCode=' module/module.prop | cut -d'=' -f2)
          new_code=$((current_code + 1))

          echo "Version code: $current_code -> $new_code"
          echo "new_code=$new_code" >> "$GITHUB_OUTPUT"

      - name: Update module.prop
        run: |
          sed -i "s/^version=.*/version=${{ inputs.version }}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ steps.versioning.outputs.new_code }}/" module/module.prop

      - name: Update update.json
        run: |
          ver="${{ inputs.version }}"
          zip_url="https://github.com/kinginu/oneplus13t-fix-camera/releases/download/${ver}/oneplus13t-fix-camera-${ver}.zip"
          jq \
            --arg ver "$ver" \
            --arg code "${{ steps.versioning.outputs.new_code }}" \
            --arg url "$zip_url" \
            '.version = $ver | .versionCode = ($code | tonumber) | .zipUrl = $url' \
            update.json > tmp.json && mv tmp.json update.json

      - name: Update changelog.md
        env:
          CHANGELOG_NOTES: ${{ inputs.changelog_notes }}
        run: |
          {
            echo "## ${{ inputs.version }} ($(date +'%Y-%m-%d'))"
            echo
            printf "%s\n" "$CHANGELOG_NOTES"
            echo
          } > new_entry.txt
          cat new_entry.txt changelog.md > temp && mv temp changelog.md

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add module/module.prop update.json changelog.md
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push

      - name: Create tag
        run: |
          git tag ${{ inputs.version }}
          git push origin ${{ inputs.version }}

      - name: Build module ZIP
        id: build_zip
        run: |
          ver="${{ inputs.version }}"
          zip_name="oneplus13t-fix-camera-${ver}.zip"
          (cd module && zip -r9 "../${zip_name}" .)
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          CHANGELOG_NOTES: ${{ inputs.changelog_notes }}
        run: |
          {
            echo "## Changelog"
            echo
            printf "%s\n" "$CHANGELOG_NOTES"
          } > RELEASE_BODY.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "Module for ${{ inputs.version }}"
          files: |
            ${{ steps.build_zip.outputs.zip_name }}
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
